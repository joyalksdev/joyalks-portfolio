<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Restricted - Joyal K.S.</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #0a0a0a;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Effects */
    body::before {
      content: '';
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      pointer-events: none;
      animation: pulse-glow 4s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: fixed;
      top: 20%;
      right: 20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
      pointer-events: none;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        opacity: 0.5;
        transform: translate(-50%, -50%) scale(1);
      }
      50% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
      position: relative;
      z-index: 10;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-container {
      margin: 0 auto 2.5rem;
      position: relative;
      width: 100px;
      height: 100px;
    }

    .icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      position: relative;
      z-index: 2;
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.4);
    }

    .icon::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      opacity: 0.3;
      animation: rotate 3s linear infinite;
      z-index: -1;
    }

    @keyframes rotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #a5b4fc 0%, #c4b5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 1.125rem;
      color: #71717a;
      margin-bottom: 2.5rem;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .message-box {
      background: rgba(39, 39, 42, 0.4);
      border: 1px solid rgba(63, 63, 70, 0.6);
      border-radius: 16px;
      padding: 2rem;
      margin-bottom: 2.5rem;
      backdrop-filter: blur(10px);
    }

    .message-box p {
      font-size: 1rem;
      line-height: 1.7;
      color: #a1a1aa;
      margin: 0;
    }

    .message-box p strong {
      color: #e4e4e7;
      font-weight: 600;
    }

    .cta-button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 2.5rem;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
    }

    .cta-button::after {
      content: '→';
      transition: transform 0.3s ease;
    }

    .cta-button:hover::after {
      transform: translateX(4px);
    }

    .footer {
      margin-top: 4rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(39, 39, 42, 0.8);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .footer-links a {
      color: #71717a;
      text-decoration: none;
      font-size: 0.875rem;
      transition: color 0.2s ease;
      position: relative;
    }

    .footer-links a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: #6366f1;
      transition: width 0.3s ease;
    }

    .footer-links a:hover {
      color: #a5b4fc;
    }

    .footer-links a:hover::after {
      width: 100%;
    }

    .footer-links .separator {
      color: #3f3f46;
      user-select: none;
    }

    .copyright {
      color: #52525b;
      font-size: 0.875rem;
      margin-top: 1rem;
    }

    .countdown {
      margin-top: 2rem;
      font-size: 0.875rem;
      color: #71717a;
    }

    .countdown span {
      color: #6366f1;
      font-weight: 600;
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 2rem;
      }
      h2 {
        font-size: 1rem;
      }
      .icon-container {
        width: 80px;
        height: 80px;
      }
      .icon {
        width: 80px;
        height: 80px;
        font-size: 40px;
      }
      .message-box {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <div class="icon">🔒</div>
    </div>

    <h1>Access Restricted</h1>
    <h2>Developer Tools Detected</h2>

    <div class="message-box">
      <p>
        <strong>Curious about how this was built?</strong><br>
        I'd love to chat about the tech stack, design decisions, and implementation details. Let's connect!
      </p>
    </div>

    <a href="/" class="cta-button">Get in Touch</a>

    <div class="countdown">
      Redirecting to homepage in <span id="timer">5</span> seconds...
    </div>

    <div class="footer">
      <div class="footer-links">
        <a href="/">Privacy</a>
        <span class="separator">•</span>
        <a href="/">Terms</a>
        <span class="separator">•</span>
        <a href="/about">About</a>
      </div>
      <div class="copyright">© 2026 Joyal K.S.</div>
    </div>
  </div>

  <script>
    // Clear session storage flag to allow return
    sessionStorage.removeItem('devtools-blocked');

    // Countdown timer
    let timeLeft = 5;
    const timerElement = document.getElementById('timer');

    const countdown = setInterval(() => {
      timeLeft--;
      timerElement.textContent = timeLeft;

      if (timeLeft <= 0) {
        clearInterval(countdown);
        window.location.href = '/';
      }
    }, 1000);
  </script>
</body>
</html>
